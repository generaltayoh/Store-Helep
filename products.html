<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F4EC">
  <title>Products · Store Helep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app has-nav">

    <section class="products-page">
      <div class="products-head">
        <h1 class="page-title" data-i18n="prod.title">Products</h1>
        <button class="add-btn" aria-label="Add product">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </button>
      </div>

      <div class="stat-grid-2">
        <div class="card stat-box">
          <div class="label" data-i18n="prod.statTotal">Total products</div>
          <div class="value">0</div>
        </div>
        <div class="card stat-box">
          <div class="label" data-i18n="prod.statValue">Stock value</div>
          <div class="value">FCFA 0</div>
        </div>
        <div class="card stat-box amber">
          <div class="label" data-i18n="prod.statLow">Low stock</div>
          <div class="value">0</div>
        </div>
        <div class="card stat-box red">
          <div class="label" data-i18n="prod.statOut">Out of stock</div>
          <div class="value">0</div>
        </div>
      </div>

      <div class="search-bar">
        <svg class="search-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="input search-input" id="productSearch" type="search" data-i18n-placeholder="prod.search" placeholder="Search products" />
      </div>

      <div class="chips chip-row" data-chips>
        <button class="chip active" data-value="all" data-i18n="common.all">All</button>
        <button class="chip amber" data-value="low_stock" data-i18n="prod.lowStock">Low stock</button>
        <button class="chip red" data-value="out_of_stock" data-i18n="prod.outOfStock">Out of stock</button>
        <button class="chip" data-value="Drinks" data-i18n="prod.cat.drinks">Drinks</button>
        <button class="chip" data-value="Groceries" data-i18n="prod.cat.groceries">Groceries</button>
      </div>

      <div class="record-list">
        <div class="card"><span class="txt" data-i18n="prod.noProducts">No products found.</span></div>
      </div>
    </section>

    <nav class="bottom-nav">
      <a class="nav-item" href="dashboard.html" data-i18n="nav.home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        Home
      </a>
      <a class="nav-item" href="records.html" data-i18n="nav.records">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8"/><path d="M8 12h8"/><path d="M8 16h4"/></svg>
        Records
      </a>
      <a class="nav-item scan" href="scan.html" data-i18n="nav.scan">
        <span class="scan-circle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L8 6H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-4l-1.5-2z"/><circle cx="12" cy="13" r="3.2"/></svg>
        </span>
        <span>Scan</span>
      </a>
      <a class="nav-item active" href="products.html" data-i18n="nav.products">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg>
        Products
      </a>
      <a class="nav-item" href="analytics.html" data-i18n="nav.analytics">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-5 3 3 5-7"/></svg>
        Analytics
      </a>
    </nav>

  </main>
  <script src="js/app.js"></script>
</body>
</html>
