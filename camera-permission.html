<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F4EC">
  <title>Camera permission · Store Helep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <section class="perm">

      <div class="icon-tile">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 4h-5L8 6H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-4l-1.5-2z"/>
          <circle cx="12" cy="13" r="3.2"/>
        </svg>
      </div>

      <h1 data-i18n="perm.title">Store Helep needs your camera</h1>
      <p data-i18n="perm.desc">We only use your camera when you choose to scan a page. Photos of your records stay on your phone until they're backed up.</p>

      <button class="btn btn-primary" data-nav="dashboard.html?welcome=1" data-loading="true" data-i18n="perm.allow">Allow camera</button>
      <button class="link-btn" data-nav="dashboard.html?welcome=1" data-loading="true" data-i18n="perm.later">Not now</button>

    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
