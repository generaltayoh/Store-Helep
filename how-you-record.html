<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F4EC">
  <title>How do you record · Store Helep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <section class="onboard">

      <div class="back-alone" style="margin:24px 0 18px;">
        <button class="back-btn" data-nav="landing.html" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </button>
      </div>

      <h1 data-i18n="record.title">How do you record your business today?</h1>
      <p class="lede" data-i18n="record.lede">This helps us set things up the way you already work.</p>

      <div class="method-list" id="methodList">
        <button class="method-card selected" data-method="Notebook">
          <span class="icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7"/><path d="M9 11h7"/></svg>
          </span>
          <span class="txt">
            <b data-i18n="method.notebook">Notebook</b>
            <span data-i18n="method.recNote">Recommended — we'll help you scan it.</span>
          </span>
          <span class="selected-tag" data-i18n="setup.selected">Selected</span>
        </button>

        <button class="method-card" data-method="Receipts">
          <span class="icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
          </span>
          <span class="txt">
            <b data-i18n="method.receipts">Receipts</b>
          </span>
        </button>

        <button class="method-card" data-method="Spreadsheet">
          <span class="icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M12 3v18"/></svg>
          </span>
          <span class="txt">
            <b data-i18n="method.spreadsheet">Spreadsheet</b>
          </span>
        </button>

        <button class="method-card" data-method="Other">
          <span class="icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/></svg>
          </span>
          <span class="txt">
            <b data-i18n="type.other">Other</b>
          </span>
        </button>
      </div>

      <button class="btn btn-primary" style="margin-top:26px;" data-nav="setup-shop.html" data-i18n="setup.continue">Continue</button>

    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
