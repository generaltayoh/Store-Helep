<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F4EC">
  <title>Welcome Back · Store Helep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <section class="onboard">

      <div class="page-header-row">
        <button class="back-btn" data-nav="landing.html" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </button>
        <span class="header-title" data-i18n="login.header">Sign in to continue</span>
      </div>

      <h1 class="login-welcome" data-i18n="login.welcome">Welcome Back</h1>

      <form class="login-form" data-next="dashboard.html?welcome=1">
        <div class="field">
          <label for="loginName" data-i18n="setup.bizName">Business name</label>
          <input class="input" type="text" id="loginName" placeholder="njeiforbi">
        </div>

        <div class="field">
          <label for="loginEmail" data-i18n="setup.bizEmail">Business email</label>
          <input class="input" type="email" id="loginEmail" placeholder="njeiforbi.com">
        </div>

        <button class="btn btn-primary" type="submit" style="margin-top:26px;" data-i18n="setup.continue">Continue</button>
      </form>

    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
