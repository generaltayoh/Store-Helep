<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F4EC">
  <title>How scanning works · Store Helep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <section class="onboard">

      <div style="margin:24px 0 18px;">
        <button class="back-btn" data-nav="setup-shop.html" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </button>
      </div>

      <h1 data-i18n="scanw.title">How scanning works</h1>

      <div class="steps">
        <div class="step">
          <div class="rail">
            <span class="num">1</span>
            <span class="line"></span>
          </div>
          <div class="body">
            <b data-i18n="scanw.s1">Take a photo of your page</b>
            <p data-i18n="scanw.s1d">Just like a normal photo — lay the notebook flat and snap it.</p>
          </div>
        </div>

        <div class="step">
          <div class="rail">
            <span class="num">2</span>
            <span class="line"></span>
          </div>
          <div class="body">
            <b data-i18n="scanw.s2">We read the records</b>
            <p data-i18n="scanw.s2d">Our AI reads dates, products, quantities and prices from the page.</p>
          </div>
        </div>

        <div class="step">
          <div class="rail">
            <span class="num">3</span>
            <span class="line"></span>
          </div>
          <div class="body">
            <b data-i18n="scanw.s3">You review and confirm</b>
            <p data-i18n="scanw.s3d">Nothing is saved as a business record until you say it's correct.</p>
          </div>
        </div>
      </div>

      <button class="btn btn-primary" style="margin-top:12px;" data-nav="camera-permission.html" data-i18n="scanw.gotit">Got it</button>

    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
